<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yura-vote</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --ink: #10131a;
      --ink-soft: #5b6472;
      --signal: #e84e1b;
      --paper: #f3f5f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-content: center;
      padding: 2rem;
      font-family: system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(700px 360px at 80% 0%, rgba(232, 78, 27, 0.12), transparent 55%),
        linear-gradient(180deg, #f7f8fb, var(--paper));
    }
    main { max-width: 28rem; text-align: center; }
    .brand {
      margin: 0 0 0.75rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--signal);
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      letter-spacing: -0.04em;
      line-height: 1.1;
    }
    p {
      margin: 0 0 1.5rem;
      color: var(--ink-soft);
      line-height: 1.5;
    }
    a {
      color: var(--ink);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">yura-vote</p>
    <h1>Скоро здесь будет проект</h1>
    <p>Заглушка. Репозиторий подключён к GitHub Pages.</p>
    <p><a href="https://codexdev.ru">codexdev.ru</a></p>
  </main>
</body>
</html>
